name: AdMeld
description: 'AdMeld was a New York City advertising-technology company founded in 2007 (by Ben
  Barokas and Brian Adams) that ran a supply-side platform / private ad exchange helping premium
  digital publishers optimize and monetize their ad inventory (serving 500+ publishers including
  FOX News and The Weather Channel). Google acquired AdMeld in 2011 for roughly $400M and folded
  its technology into the DoubleClick Ad Exchange. AdMeld no longer operates as an independent
  product and exposes no standalone public API; the admeld.com domain now serves a Google-maintained
  legacy landing page for DoubleClick Ad Exchange (Google nameservers, Google-hosted).'
